name: Build Android APK

on:
  push:
    branches: [main, redesign/apple-tv-home]
  workflow_dispatch:

permissions:
  contents: read

# Chỉ giữ một lượt build cho mỗi nhánh; commit mới thay thế lượt build cũ.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not ask setup-android to install the obsolete SDK package "tools".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install launcher Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Rebuild the bundled TV launcher from its pinned patch before packaging the app.
      - name: Build bundled TV launcher and data
        run: |
          chmod +x scripts/dung-launcher.sh ./gradlew
          scripts/dung-launcher.sh

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Home-Sach-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
